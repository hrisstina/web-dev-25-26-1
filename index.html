<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title style="font-family: 'Courier New', Courier, monospace; font-weight: bold;">Frontend – Backend Demo – by Hriss Tsvetanova</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px;background-color: bisque; }
    #joke, #jokesList {
      margin-top: 20px; padding: 10px; border: 4px inset rgb(212,111,144); width: 60%;
      min-height: 20px;
    }
    button { padding: 8px 12px; margin-right: 10px; cursor: pointer; }
    ul { list-style: square; padding-left: 20px; }
    .pic { display: block; margin: 24px auto; width: 20%; }
    footer { text-align: center; margin-top: 40px; }
  </style>
</head>
<body>
  <header><h1 style="font-family: 'Courier New', Courier, monospace;font-weight: bold;">Frontend & Backend Communication</h1></header>

  <main>
    <section>
      <p style="font-family: 'Courier New', Courier, monospace;font-weight: bold;">This page calls a public backend API for random Chuck Norris jokes.</p>

      <!-- Бутон 1: една шега -->
      <button id="btn1" style="font-family: 'Courier New', Courier, monospace;font-weight: bold;">Get Joke</button>
      <article id="joke"></article>

      <!-- Бутон 2: две шеги като списък -->
      <br /><br />
      <button id="btn2" style="font-family: 'Courier New', Courier, monospace; font-weight: bold;">Get 2 Jokes</button>
      <article id="jokesList"></article>

      <br /><br />
      <a href="https://api.chucknorris.io" style="font-family: 'Courier New', monospace; font-weight: bold;">
        Dirty jokes about Chuck Norris
      </a>

      <img class="pic" src="img/645-200x200.jpeg" alt="Chuck Norris" />
      <footer style="font-family: monospace;text:bold;">All rights reserved 14.10.2025</footer>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const oneOut = document.getElementById('joke');
      const listOut = document.getElementById('jokesList');
      const btn1 = document.getElementById('btn1');
      const btn2 = document.getElementById('btn2');

      async function getJoke() {
        const r = await fetch('https://api.chucknorris.io/jokes/random');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        return data.value;
      }

      btn1.onclick = async () => {
        oneOut.textContent = 'Loading...';
        try {
          oneOut.textContent = await getJoke();
        } catch (err) {
          console.error(err);
          oneOut.textContent = 'Error loading joke. Check your internet or try again.';
        }
      };

      btn2.onclick = async () => {
        listOut.textContent = 'Loading...';
        try {
          const [j1, j2] = await Promise.all([getJoke(), getJoke()]);
          listOut.innerHTML = `<ul><li>${j1}</li><li>${j2}</li></ul>`;
        } catch (err) {
          console.error(err);
          listOut.textContent = 'Error loading jokes. Check your internet or try again.';
        }
      };
    });
  </script>
</body>
</html>
